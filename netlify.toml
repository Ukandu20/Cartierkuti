[build]
  # If your front-end lives in `frontend/`
  base    = "frontend"
  command = "npm ci && npm run build"

  publish = "build"

# Single-page‐app routing
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
